{% extends 'base.html' %}

{% block content %}
<div class="container py-5" style="max-width: 420px;">
    <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
            <h3 class="fw-bold">Sign In</h3>
            <p class="text-secondary small">Access the {{ site_settings.site_name|default:"SocialSolve" }} Dashboard</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-info w-100 py-2 mt-2 fw-semibold">Log In</button>
        </form>

        <p class="text-center text-secondary small mt-4 mb-0">
            Don't have an account? <a href="{% url 'register' %}" class="text-info text-decoration-none">Register</a>
        </p>
    </div>
</div>
{% endblock %}
